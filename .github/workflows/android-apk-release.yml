name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 20.19.4
  EXPO_PUBLIC_API_BASE_URL: https://{slug}.sismu.biz.id
  EXPO_PUBLIC_ROOT_DOMAIN: sismu.biz.id
  EXPO_PUBLIC_API_SCHEME: https
  EXPO_PUBLIC_SCHOOL_DIRECTORY_URL: https://admin26.sismu.biz.id/api/mobile/schools
  EXPO_PUBLIC_ALLOW_INSECURE_API: "false"

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/edusmart-mobile-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edusmart-mobile-apk
          path: release/*.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
