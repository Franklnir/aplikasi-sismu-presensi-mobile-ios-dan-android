name: EAS Internal Distribution

on:
  workflow_dispatch:

env:
  NODE_VERSION: 20.19.4
  EXPO_PUBLIC_API_BASE_URL: https://{slug}.sismu.biz.id
  EXPO_PUBLIC_ROOT_DOMAIN: sismu.biz.id
  EXPO_PUBLIC_API_SCHEME: https
  EXPO_PUBLIC_SCHOOL_DIRECTORY_URL: https://admin26.sismu.biz.id/api/mobile/schools
  EXPO_PUBLIC_ALLOW_INSECURE_API: "false"

jobs:
  submit-eas-builds:
    name: Submit Android and iOS builds to EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Submit internal builds
        run: eas build --platform all --profile preview --non-interactive --no-wait
